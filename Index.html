  if(i===undefined){r.className='er';$('lb').textContent='Barcode '+raw;$('dest').textContent='-';$('nm').textContent='';$('ds').textContent='Data barang belum terdaftar';$('mt').textContent='';beep(false);return}
  const it=D.items[i];$('lb').textContent='Barcode '+raw;$('ds').textContent=it[0];$('mt').textContent='PLU '+it[4]+' | '+it[1]+' pcs';
  if(it[2]){r.className='ok';$('dest').textContent=it[2];$('nm').textContent='KIRIM KE '+it[3]}
  else{r.className='wn';$('dest').textContent='TAHAN';$('nm').textContent='Belum ada toko tujuan, lapor Inventory Control'}
  beep(true)}
function onCode(c){const n=Date.now();if(c===last&&n-lastT<2000)return;last=c;lastT=n;show(c)}
$('go').onclick=()=>{show($('q').value);$('q').value='';$('q').focus()};
$('q').onkeydown=e=>{if(e.key==='Enter')$('go').onclick()};
function stop(){if(timer)clearTimeout(timer);timer=null;try{reader&&reader.reset()}catch(e){}reader=null;stream&&stream.getTracks().forEach(t=>t.stop());stream=null;$('cam').classList.remove('on');$('bc').textContent='Mulai kamera';$('st').textContent='Kamera berhenti.'}
async function start(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('st').textContent='Kamera langsung tidak tersedia di sini. Pakai tombol Ambil foto barcode atau kotak input di bawah.';return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){$('st').textContent='Kamera langsung diblokir ('+e.name+'). Pakai tombol Ambil foto barcode, atau buka link ini langsung di Chrome.';return}
  const v=$('v');v.srcObject=stream;await v.play().catch(()=>{});$('cam').classList.add('on');$('bc').textContent='Stop kamera';$('st').textContent='Arahkan kamera ke barcode barang.';
  if('BarcodeDetector' in window){
    const want=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'];let fm=want;
    try{const s=await BarcodeDetector.getSupportedFormats();fm=want.filter(f=>s.includes(f))}catch(e){}
    const det=new BarcodeDetector({formats:fm});
    const loop=async()=>{if(!stream)return;try{if(v.readyState>=2){const r=await det.detect(v);if(r.length)onCode(r[0].rawValue)}}catch(e){}timer=setTimeout(loop,150)};loop()}
  else if(window.ZXing){
    const Z=ZXing,h=new Map();h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF]);h.set(Z.DecodeHintType.TRY_HARDER,true);
    reader=new Z.BrowserMultiFormatReader(h,120);reader.decodeFromStream(stream,v,(r)=>{if(r)onCode(r.getText())})}
  else{$('st').textContent='Pemindai kamera gagal dimuat. Gunakan kotak input di bawah.'}}
$('bc').onclick=()=>stream?stop():start();
$('pb').onclick=()=>$('ph').click();
$('ph').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;$('st').textContent='Membaca foto...';let code=null;
 try{if('BarcodeDetector' in window){const r=await new BarcodeDetector().detect(await createImageBitmap(f));if(r.length)code=r[0].rawValue}}catch(x){}
 if(!code&&window.ZXing){try{const Z=ZXing,h=new Map(),u=URL.createObjectURL(f);h.set(Z.DecodeHintType.TRY_HARDER,true);const r=await new Z.BrowserMultiFormatReader(h).decodeFromImageUrl(u);code=r.getText();URL.revokeObjectURL(u)}catch(x){}}
 if(code){last='';$('st').textContent='Foto terbaca.';onCode(code)}else $('st').textContent='Barcode tidak terbaca. Foto lebih dekat, terang, dan fokus.'};
</script></body></html>
